<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa</title>
  <script>
    /* Set tema lebih awal supaya tidak berkedip saat halaman dimuat */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --primary: #1769aa;
      --accent: #00bcd4;
      --g1: #1769aa;
      --dark: #0d2b45;
      --soft: #eaf2f8;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text: #3d5266;
      --line: #d3e2ee;
      --bar: #e3edf5;
      --muted: #8aa0b3;
      --avatar-border: #fff;
      --chip-hover-text: #fff;
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.30);
    }
    :root[data-theme="dark"] {
      --primary: #63b6f2;
      --accent: #00bcd4;
      --g1: #1769aa;
      --dark: #e6f1fa;
      --soft: #1c3552;
      --card-bg: rgba(14, 26, 48, 0.93);
      --text: #b8c8d9;
      --line: #2b4560;
      --bar: #223a55;
      --muted: #7189a2;
      --avatar-border: #16263f;
      --chip-hover-text: #06182a;
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: #0d2b45;
      color: var(--dark);
      overflow-x: hidden;
    }

    /* ===================== LATAR LANGIT ===================== */
    .sky {
      position: fixed; inset: 0; z-index: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }
    .sky-day   { background: linear-gradient(180deg, #3f9be0 0%, #7cc4f0 50%, #d6f0fc 100%); opacity: 1; }
    .sky-night { background: linear-gradient(180deg, #03050f 0%, #0a1433 55%, #1b2b5e 100%); opacity: 0; }
    :root[data-theme="dark"] .sky-day   { opacity: 0; }
    :root[data-theme="dark"] .sky-night { opacity: 1; }

    /* ---------- Matahari (mode terang) ---------- */
    .sun {
      position: fixed; z-index: 0;
      top: 7%; right: 9%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbc4, #ffd93b 55%, #ffb300);
      box-shadow: 0 0 40px 18px rgba(255, 214, 59, .55), 0 0 120px 60px rgba(255, 200, 0, .28);
      transition: transform 1s ease, opacity .8s ease;
      pointer-events: none;
    }
    .sun::before {
      content: ""; position: absolute; inset: -46px; border-radius: 50%;
      background: repeating-conic-gradient(rgba(255, 232, 110, .6) 0 5deg, transparent 5deg 15deg);
      -webkit-mask: radial-gradient(circle, transparent 46%, #000 48%, transparent 72%);
              mask: radial-gradient(circle, transparent 46%, #000 48%, transparent 72%);
